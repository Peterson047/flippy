<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow branco no logo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo preto -->
  <circle cx="256" cy="256" r="192" fill="#000000"/>
  <!-- Borda cinza escura (externa) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#2a2a2a" stroke-width="8"/>
  <!-- Borda amarela escura (interna) -->
  <circle cx="256" cy="256" r="177" fill="none" stroke="#8B6F00" stroke-width="6"/>

  <!-- Logo com mais respiro (60% da área) e glow aplicado -->
  <svg x="84" y="150" width="345" height="213" viewBox="-10 112 210 130">
